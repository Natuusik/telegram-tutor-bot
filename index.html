<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт Отзывов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Оставить отзыв</h2>

    <!-- Красивая форма отправки отзывов -->
   <form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="25a52992-4258-4960-beb2-fb81d4c2fea8">
  <input type="text" name="name" required>
  <input type="email" name="email" required>
  <textarea name="message" required></textarea>
  <button type="submit">Submit Form</button>
</form>

      <div class="form-group">
        <label for="user-rating">Ваша оценка:</label>
        <select name="rating" id="user-rating" required>
          <option value="5">⭐⭐⭐⭐⭐ (5)</option>
          <option value="4">⭐⭐⭐⭐ (4)</option>
          <option value="3">⭐⭐⭐ (3)</option>
          <option value="2">⭐⭐ (2)</option>
          <option value="1">⭐ (1)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="user-review">Ваш отзыв:</label>
        <textarea name="message" id="user-review" placeholder="Напишите честный отзыв..." rows="5" required></textarea>
      </div>

      <button type="submit" id="submit-btn">Отправить отзыв</button>
    </form>

    <!-- Блок статуса отправки ("Ваш отзыв обрабатывается...") -->
    <div id="form-status" class="status-message"></div>

    <h2>Все отзывы</h2>
    
    <!-- Место для ручного добавления отзывов -->
    <div id="reviews-container">
      
      <div class="review-item">
        <div class="review-header">
          <span class="review-name">Наталья (Пример)</span>
          <span class="review-rating">⭐⭐⭐⭐⭐</span>
        </div>
        <p class="review-text">Отличный шаблон! Всё работает быстро и приходит на почту.</p>
      </div>

    </div>
  </div>

  <!-- Подключение вашего скрипта -->
  <script src="script.js"></script>
</body>
</html>
