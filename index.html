<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт Отзывов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Оставить отзыв</h2>

    <!-- КЛЮЧЕВОЙ МОМЕНТ: Добавили action и method прямой отправки прямо в форму с красивым дизайном -->
    <form action="https://web3forms.com" method="POST" id="review-form">
      
      <!-- Ваш рабочий ключ доступа Web3Forms -->
      <input type="hidden" name="access_key" value="25a52992-4258-4960-beb2-fb81d4c2fea8">

      <!-- Страница, куда перенаправит пользователя после успешной отправки -->
      <input type="hidden" name="redirect" value="https://web3forms.com">

      <div class="form-group">
        <label for="user-name">Ваше имя:</label>
        <input type="text" name="name" id="user-name" placeholder="Введите ваше имя" required />
      </div>

      <div class="form-group">
        <label for="user-rating">Ваша оценка:</label>
        <select name="rating" id="user-rating" required>
          <option value="5">⭐⭐⭐⭐⭐ (5)</option>
          <option value="4">⭐⭐⭐⭐ (4)</option>
          <option value="3">⭐⭐⭐ (3)</option>
          <option value="2">⭐⭐ (2)</option>
          <option value="1">⭐ (1)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="user-review">Ваш отзыв:</label>
        <textarea name="message" id="user-review" placeholder="Напишите честный отзыв..." rows="5" required></textarea>
      </div>

      <button type="submit" id="submit-btn">Отправить отзыв</button>
    </form>

    <h2>Все отзывы</h2>
    
    <div id="reviews-container">
      <div class="review-item">
        <div class="review-header">
          <span class="review-name">Наталья (Пример)</span>
          <span class="review-rating">⭐⭐⭐⭐⭐</span>
        </div>
        <p class="review-text">Отличный шаблон! Всё работает быстро и приходит на почту.</p>
      </div>
    </div>
  </div>

</body>
</html>
