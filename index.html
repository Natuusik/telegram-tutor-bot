<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт Отзывов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="25a52992-4258-4960-beb2-fb81d4c2fea8">

  <label for="name">Ваше имя</label>
  <input type="text" id="name" name="name" placeholder="Например: Алексей" required>

  <label for="email">Электронная почта</label>
  <input type="email" id="email" name="email" placeholder="name@example.com" required>

  <!-- Блок выбора оценки (Звёзды) -->
  <label>Ваша оценка</label>
  <div class="star-rating">
    <input type="radio" id="star5" name="rating" value="5" required>
    <label for="star5" title="5 звёзд">★</label>

    <input type="radio" id="star4" name="rating" value="4">
    <label for="star4" title="4 звезды">★</label>

    <input type="radio" id="star3" name="rating" value="3">
    <label for="star3" title="3 звезды">★</label>

    <input type="radio" id="star2" name="rating" value="2">
    <label for="star2" title="2 звезды">★</label>

    <input type="radio" id="star1" name="rating" value="1">
    <label for="star1" title="1 звезда">★</label>
  </div>

  <label for="message">Ваш отзыв</label>
  <textarea id="message" name="message" placeholder="Поделитесь вашим мнением..." required></textarea>

  <button type="submit">Отправить отзыв</button>
</form>

<script src="script.js"></script>
</body>
</html>
