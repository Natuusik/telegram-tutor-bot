<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт Отзывов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Оставить отзыв</h2>

    <!-- Красивая форма отправки отзывов -->
  <!-- Сама форма (структура не сломает Web3Forms) -->
<div class="custom-feedback-wrapper">
  <h3>Оставить отзыв</h3>
  <p>Поделитесь своим мнением, нам это очень важно!</p>

  <form action="https://web3forms.com" method="POST">
    <!-- Обязательный скрытый ключ (оставлен без изменений) -->
    <input type="hidden" name="access_key" value="25a52992-4258-4960-beb2-fb81d4c2fea8">

    <!-- Поле Имени -->
    <div class="form-field-group">
      <label for="user-name">Ваше имя</label>
      <input type="text" id="user-name" name="name" class="form-field-input" placeholder="Как к вам обращаться?" required>
    </div>

    <!-- Поле Email -->
    <div class="form-field-group">
      <label for="user-email">Электронная почта</label>
      <input type="email" id="user-email" name="email" class="form-field-input" placeholder="name@example.com" required>
    </div>

    <!-- Поле Сообщения -->
    <div class="form-field-group">
      <label for="user-message">Ваш отзыв или сообщение</label>
      <textarea id="user-message" name="message" class="form-field-input" placeholder="Напишите здесь всё, что думаете..." required></textarea>
    </div>

    <!-- Кнопка отправки -->
    <button type="submit" class="form-submit-btn">Отправить сообщение</button>
  </form>
</div>
      

  <!-- Подключение вашего скрипта -->
  <script src="script.js"></script>
</body>
</html>
